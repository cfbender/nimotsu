name: Android

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      MISE_ENABLE_TOOLS: android-sdk,aube,java,node
      NIMOTSU_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          install: true
          install_args: android-sdk aube java node
          cache: true

      - name: Set up Android SDK
        shell: bash
        run: |
          tool_root=$(mise where android-sdk)
          sdk_root="${HOME}/.local/share/android-sdk"
          sdkmanager=$(find "${tool_root}/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print -quit)
          if [[ -z "${sdkmanager}" ]]; then
            echo "Could not locate sdkmanager under ${tool_root}" >&2
            exit 1
          fi
          mkdir -p "${sdk_root}"
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          echo "$(dirname "${sdkmanager}")" >> "$GITHUB_PATH"
          echo "${sdk_root}/platform-tools" >> "$GITHUB_PATH"
          yes | "${sdkmanager}" --sdk_root="${sdk_root}" --licenses >/dev/null || true
          "${sdkmanager}" --sdk_root="${sdk_root}" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" >/dev/null

      - name: Install JavaScript dependencies
        run: aube install --frozen-lockfile

      - name: Resolve app version
        shell: bash
        run: |
          base_version=$(node -p "require('./package.json').version")
          artifact_version="${base_version}-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            base_version="${GITHUB_REF_NAME#v}"
            artifact_version="${base_version}"
          fi
          echo "NIMOTSU_VERSION=${base_version}" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=${artifact_version}" >> "$GITHUB_ENV"

      - name: Restore Android release keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NIMOTSU_ANDROID_KEYSTORE_BASE64: ${{ secrets.NIMOTSU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${NIMOTSU_ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "Missing NIMOTSU_ANDROID_KEYSTORE_BASE64. Run: aube run android:signing:setup" >&2
            exit 1
          fi
          mkdir -p android/release
          printf '%s' "${NIMOTSU_ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/release/nimotsu-release.jks
          echo "NIMOTSU_ANDROID_KEYSTORE=${GITHUB_WORKSPACE}/android/release/nimotsu-release.jks" >> "$GITHUB_ENV"

      - name: Validate Android release keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NIMOTSU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIMOTSU_ANDROID_KEYSTORE_PASSWORD }}
          NIMOTSU_ANDROID_KEY_ALIAS: ${{ secrets.NIMOTSU_ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "${NIMOTSU_ANDROID_KEYSTORE_PASSWORD}" || -z "${NIMOTSU_ANDROID_KEY_ALIAS}" ]]; then
            echo "Missing Android keystore password or alias secret." >&2
            exit 1
          fi
          keytool -list \
            -keystore "${NIMOTSU_ANDROID_KEYSTORE}" \
            -alias "${NIMOTSU_ANDROID_KEY_ALIAS}" \
            -storepass:env NIMOTSU_ANDROID_KEYSTORE_PASSWORD >/dev/null

      - name: Restore optional Firebase configuration
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          NIMOTSU_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.NIMOTSU_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "${NIMOTSU_GOOGLE_SERVICES_JSON_BASE64}" ]]; then
            printf '%s' "${NIMOTSU_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json
          else
            echo "NIMOTSU_GOOGLE_SERVICES_JSON_BASE64 is not set; this APK will not register for push notifications."
          fi

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          NIMOTSU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIMOTSU_ANDROID_KEYSTORE_PASSWORD }}
          NIMOTSU_ANDROID_KEY_ALIAS: ${{ secrets.NIMOTSU_ANDROID_KEY_ALIAS }}
          NIMOTSU_ANDROID_KEY_PASSWORD: ${{ secrets.NIMOTSU_ANDROID_KEY_PASSWORD }}
        run: aube run android:build:release

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: aube run android:build:debug

      - name: Verify and stage APK
        shell: bash
        run: |
          mkdir -p dist/android
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            source_apk=android/app/build/outputs/apk/debug/app-debug.apk
            output_apk="dist/android/nimotsu-${ARTIFACT_VERSION}-debug.apk"
          else
            source_apk=android/app/build/outputs/apk/release/app-release.apk
            output_apk="dist/android/nimotsu-${ARTIFACT_VERSION}-release.apk"
            apksigner=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            "${apksigner}" verify --verbose --print-certs "${source_apk}"
          fi
          cp "${source_apk}" "${output_apk}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nimotsu-${{ env.ARTIFACT_VERSION }}-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}-apk
          path: dist/android/*.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/android

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: dist/android/**/*.apk
