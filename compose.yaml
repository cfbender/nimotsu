services:
  nimotsu:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NIMOTSU_API_TOKEN: ${NIMOTSU_API_TOKEN:-}
      NIMOTSU_SHIPPO_API_TOKEN: ${NIMOTSU_SHIPPO_API_TOKEN:-}
      NIMOTSU_SHIPPO_WEBHOOK_TOKEN: ${NIMOTSU_SHIPPO_WEBHOOK_TOKEN:-}
      NIMOTSU_FIREBASE_CREDENTIALS: ${NIMOTSU_FIREBASE_CREDENTIALS:-}
      NIMOTSU_GMAIL_CLIENT_ID: ${NIMOTSU_GMAIL_CLIENT_ID:-}
      NIMOTSU_GMAIL_CLIENT_SECRET: ${NIMOTSU_GMAIL_CLIENT_SECRET:-}
      NIMOTSU_PUBLIC_URL: ${NIMOTSU_PUBLIC_URL:-}
      NIMOTSU_ENCRYPTION_KEY: ${NIMOTSU_ENCRYPTION_KEY:-}
    volumes:
      - nimotsu-data:/data

volumes:
  nimotsu-data:
