min_version = "2026.10.17"

[tools]
android-sdk = "23.0"
aube = "2.8.1"
go = "1.26.10"
java = "temurin-21.0.12+8.0.LTS"
node = "22.23.2"

[env]
ANDROID_HOME = "{{ env.HOME }}/.local/share/android-sdk"
ANDROID_SDK_ROOT = "{{ env.HOME }}/.local/share/android-sdk"
_.path = [
  "{{ env.HOME }}/.local/share/android-sdk/cmdline-tools/latest/bin",
  "{{ env.HOME }}/.local/share/android-sdk/platform-tools",
]

[tasks.check]
description = "Run all backend and web checks"
run = [
  "go test ./...",
  "aube run check",
]

[tasks.build]
description = "Build the server, web app, and Android debug APK"
depends = ["check"]
run = [
  "aube run build",
  "go build ./cmd/nimotsu",
  "aube run android:sync",
  "cd android && ./gradlew assembleDebug",
]
